spring.application.name=backend

# Configuracoes de seguranca
api.security.token.secret=${JWT_SECRET}

# Conexao com o banco de dados PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/duotune_db
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configuracoes de E-mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=duotune.invite@gmail.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Integracao com a API do Spotify
spotify.client.id=${SPOTIFY_CLIENT_ID}
spotify.client.secret=${SPOTIFY_CLIENT_SECRET}
spotify.redirect.uri=${SPOTIFY_REDIRECT_URI:${frontend.url}/api/spotify/callback}
frontend.url=${FRONTEND_URL:http://127.0.0.1:5173}

# Cookie temporario para vincular o callback ao navegador que iniciou o OAuth
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=10m

# Limites para envio da foto de perfil
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# Aplica ajustes compatíveis ao banco existente antes de inicializar o Hibernate.
spring.sql.init.mode=always
